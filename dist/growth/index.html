<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#102438" />
    <meta name="description" content="万紫千紅のキャラ・兵種・動物の成長率を組み合わせて比較できるページ。" />
    <title>万紫千紅 成長率比較</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../styles.css?v=21" />
  </head>
  <body class="growth-page">
    <header class="site-header growth-header">
      <div>
        <p class="eyebrow">FIRE EMBLEM FORTUNE'S WEAVE</p>
        <h1>成長率比較</h1>
      </div>
      <p>キャラ＋兵種＋動物</p>
    </header>

    <main class="growth-main">
      <p class="growth-guide growth-page-guide">
        下の名称をドラッグするか、PUSHを押すと上から順に入ります。スマホでは項目を横へドラッグできます。2段目のキャラは何も入れなければ同じキャラになります。
      </p>

      <section class="comparison-panel" aria-labelledby="comparison-title">
        <div class="growth-section-heading">
          <div>
            <p class="section-kicker">COMPARE</p>
            <h2 id="comparison-title">組み合わせ</h2>
          </div>
          <button id="swap-button" class="swap-button" type="button">上下を入れ替え</button>
        </div>
        <div id="comparison-slots" class="comparison-stack"></div>
        <p id="growth-status" class="growth-status" aria-live="polite"></p>
      </section>

      <section class="growth-library" aria-labelledby="library-title">
        <div class="growth-section-heading">
          <div>
            <p class="section-kicker">LIST</p>
            <h2 id="library-title">成長率一覧</h2>
          </div>
        </div>
        <div id="growth-lists" class="growth-lists"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>本サイトは非公式の個人攻略サイトで、任天堂および関係各社とは関係ありません。ゲーム内の名称等の権利は各権利者に帰属します。</p>
    </footer>

    <script src="../growth-data.js?v=1"></script>
    <script src="../evolution-class-order.js?v=1"></script>
    <script src="../class-requirements.js?v=3"></script>
    <script src="../growth.js?v=14"></script>
  </body>
</html>
