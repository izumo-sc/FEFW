<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#102438" />
    <meta name="description" content="ファイアーエムブレム 万紫千紅の共通事項と主人公別の攻略順をまとめたページ。" />
    <title>万紫千紅 攻略順など</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../styles.css?v=7" />
  </head>
  <body class="order-page">
    <header class="site-header order-header">
      <div>
        <p class="eyebrow">FIRE EMBLEM FORTUNE'S WEAVE</p>
        <h1>攻略順など</h1>
      </div>
      <a class="site-home-link" href="../">HOMEへ戻る</a>
    </header>

    <main class="order-main">
      <section class="order-panel" aria-label="攻略順">
        <div class="order-route-toggles">
          <button class="order-route-toggle" type="button" data-order-toggle="common" aria-expanded="false" aria-controls="order-common">共通</button>
          <button class="order-route-toggle" type="button" data-order-toggle="leda" aria-expanded="false" aria-controls="order-leda">レダ</button>
          <button class="order-route-toggle" type="button" data-order-toggle="dietrich" aria-expanded="false" aria-controls="order-dietrich">ディートリヒ</button>
          <button class="order-route-toggle" type="button" data-order-toggle="theodora" aria-expanded="false" aria-controls="order-theodora">セオドラ</button>
          <button class="order-route-toggle" type="button" data-order-toggle="kai" aria-expanded="false" aria-controls="order-kai">カイ</button>
        </div>

        <div id="order-common" class="route-guide-content" data-order-content="common" hidden></div>
        <div id="order-leda" class="route-guide-content" data-order-content="leda" hidden></div>
        <div id="order-dietrich" class="route-guide-content" data-order-content="dietrich" hidden></div>
        <div id="order-theodora" class="route-guide-content" data-order-content="theodora" hidden></div>
        <div id="order-kai" class="route-guide-content" data-order-content="kai" hidden></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>本サイトは非公式の個人攻略サイトで、任天堂および関係各社とは関係ありません。ゲーム内の名称等の権利は各権利者に帰属します。</p>
    </footer>
    <script src="../order.js?v=1"></script>
  </body>
</html>
