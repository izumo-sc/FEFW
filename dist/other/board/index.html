<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="same-origin">
  <meta name="theme-color" content="#102438">
  <title>万紫千紅 掲示板</title>
  <link rel="stylesheet" href="../../styles.css?v=15">
  <link rel="stylesheet" href="../other.css?v=2">
  <link rel="stylesheet" href="./board.css?v=4">
  <script src="./board-pages.js?v=1" defer></script>
  <script src="./board.js?v=5" defer></script>
</head>
<body>
  <header class="site-header other-header">
    <div><p class="eyebrow">万紫千紅</p><h1>掲示板</h1></div>
    <nav aria-label="ページ移動"><a class="site-home-link" href="../../">HOME</a></nav>
  </header>
  <main class="other-main">
    <section class="board-card" aria-labelledby="post-title">
      <h2 id="post-title">投稿する</h2>
      <form id="post-form">
        <label for="post-page">投稿先</label>
        <select id="post-page" name="page" required></select>
        <label for="post-name">名前（任意）</label>
        <input id="post-name" name="name" maxlength="30" placeholder="名無し" autocomplete="off">
        <label for="post-body">本文</label>
        <textarea id="post-body" name="body" rows="4" maxlength="2000" required></textarea>
        <div class="board-actions">
          <span class="board-note" id="body-count">0 / 2000</span>
          <button id="submit-post" type="submit">投稿する</button>
        </div>
      </form>
      <p class="board-note">自分の投稿は、投稿したブラウザから削除できます。</p>
    </section>
    <div class="board-heading"><h2>投稿一覧</h2><button id="refresh-posts" type="button">更新</button></div>
    <div class="board-filter"><label for="filter-page">表示する投稿先</label><select id="filter-page"><option value="">すべて</option></select></div>
    <p id="board-status" role="status" aria-live="polite"></p>
    <div id="posts"></div>
    <button id="more-posts" type="button" hidden>以前の投稿を表示</button>
    <noscript>掲示板を利用するにはJavaScriptを有効にしてください。</noscript>
  </main>
  <footer class="site-footer"><p>本サイトは非公式の個人攻略サイトで、任天堂および関係各社とは関係ありません。</p></footer>
</body>
</html>
