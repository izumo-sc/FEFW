<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#102438" />
  <meta name="description" content="40キャラ分の所持武器を5枠ずつ管理し、武器錬成素材の参考数を確認できます。" />
  <title>万紫千紅 キャラ所持武器管理</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../../styles.css?v=21" />
  <link rel="stylesheet" href="./loadout.css?v=4" />
</head>
<body class="loadout-page">
  <header class="site-header loadout-header">
    <h1>キャラ所持武器管理</h1>
    <nav><a class="site-home-link" href="../forging/">武器錬成素材へ</a><a class="site-home-link" href="../">その他へ戻る</a></nav>
  </header>
  <main class="loadout-main">
    <div class="loadout-teams" role="group" aria-label="表示するチーム">
      <button type="button" class="filter-button is-active" data-team="0" aria-pressed="true" aria-controls="loadout-board">チーム1</button>
      <button type="button" class="filter-button" data-team="1" aria-pressed="false" aria-controls="loadout-board">チーム2</button>
      <button type="button" class="filter-button" data-team="2" aria-pressed="false" aria-controls="loadout-board">チーム3</button>
      <button type="button" class="filter-button" data-team="3" aria-pressed="false" aria-controls="loadout-board">チーム4</button>
      <button type="button" class="filter-button" data-team="4" aria-pressed="false" aria-controls="loadout-board">チーム5</button>
    </div>
    <section class="loadout-intro">
      <p>上部のボタンで5チームを切り替えます。各チームは横8キャラ、各キャラに武器5枠。各枠を押してキャラ・武器を選択できます。同じキャラは全チームを通して1枠だけ配置できます。</p>
      <p>全チームに配置した武器数は<a href="../forging/">武器錬成素材</a>の「参考数」に反映されます。画面が狭い場合は武器スロット部分を横にスクロールできます。</p>
    </section>
    <p id="loadout-status" class="sr-only" role="status"></p>
    <div id="loadout-board" class="loadout-board" role="region" aria-label="チーム1" tabindex="0"></div>
    <div class="loadout-reset-row"><button id="loadout-reset" class="quiet-button" type="button">すべてリセット</button></div>
    <noscript><p>所持武器を管理するにはJavaScriptを有効にしてください。</p></noscript>
  </main>
  <footer class="site-footer"><p>本サイトは非公式の個人攻略サイトで、任天堂および関係各社とは関係ありません。ゲーム内の名称等の権利は各権利者に帰属します。</p></footer>
  <dialog id="loadout-picker" aria-labelledby="loadout-picker-title">
    <div class="loadout-toolbar"><h2 id="loadout-picker-title">選択</h2><button id="loadout-picker-close" class="quiet-button" type="button">閉じる</button></div>
    <label class="loadout-picker-search"><span class="sr-only">選択候補を検索</span><input id="loadout-picker-search" type="search" placeholder="名前を検索" /></label>
    <div id="loadout-picker-items" class="loadout-picker-items"></div>
    <button id="loadout-picker-clear" class="quiet-button" type="button">この枠を空にする</button>
  </dialog>
  <dialog id="loadout-reset-dialog" aria-labelledby="loadout-reset-title">
    <form method="dialog"><h2 id="loadout-reset-title">すべてリセットしますか？</h2><p>40枠のキャラと所持武器を空にします。武器錬成素材の作成数・採集数は残ります。</p><div class="dialog-actions"><button value="cancel" class="quiet-button">キャンセル</button><button value="confirm" class="danger-button">リセット</button></div></form>
  </dialog>
  <script src="../forging/forging-data.js?v=2"></script>
  <script src="./characters-data.js?v=1"></script>
  <script src="./loadout-model.js?v=2"></script>
  <script src="./loadout.js?v=4"></script>
</body>
</html>
