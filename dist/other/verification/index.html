<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#102438" />
    <meta name="description" content="万紫千紅の検証記録。Xの投稿やYouTube動画を掲載しています。" />
    <title>万紫千紅 検証記録</title>
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../../styles.css?v=15" />
    <link rel="stylesheet" href="../other.css?v=2" />
  </head>
  <body class="verification-page">
    <header class="site-header other-header">
      <div><p class="eyebrow">その他</p><h1>検証記録</h1></div>
      <nav aria-label="ページ移動">
        <a class="site-home-link" href="../">その他へ戻る</a>
        <a class="site-home-link" href="../../">HOME</a>
      </nav>
    </header>
    <main class="other-main">
      <div class="verification-toolbar">
        <div class="verification-filters" role="group" aria-label="記録の種類">
          <button type="button" data-record-filter="all" aria-pressed="true">すべて</button>
          <button type="button" data-record-filter="x" aria-pressed="false">X</button>
          <button type="button" data-record-filter="youtube" aria-pressed="false">YouTube</button>
        </div>
        <p id="verification-count" role="status" aria-live="polite"></p>
      </div>
      <div id="verification-list" class="verification-list"></div>
      <p id="verification-empty" class="verification-empty" hidden>検証記録は準備中です。</p>
      <noscript><p class="verification-empty">投稿・動画の表示にはJavaScriptを有効にしてください。</p></noscript>
    </main>
    <footer class="site-footer">
      <p>本サイトは非公式の個人攻略サイトで、任天堂および関係各社とは関係ありません。ゲーム内の名称等の権利は各権利者に帰属します。</p>
    </footer>
    <script src="./records-data.js?v=3"></script>
    <script src="./records.js?v=2"></script>
  </body>
</html>
